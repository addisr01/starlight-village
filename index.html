<style>
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); --page: #efe9fb; --ink: #2a1d4a; --soft: #5f4f8c; --plate: #fff; --edge: #d4c7f0; --focus: #7b5cff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #120d26; --ink: #f1eaff; --soft: #b7a8e2; --plate: #1d1640; --edge: #362a66; --focus: #ffe27a; } }
:root[data-theme="dark"] { --page: #120d26; --ink: #f1eaff; --soft: #b7a8e2; --plate: #1d1640; --edge: #362a66; --focus: #ffe27a; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: "Pixelify Sans", ui-rounded, "Trebuchet MS", system-ui, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
h1 { font-weight: 600; font-size: 2rem; margin: 0 0 20px; }
a { display: block; text-decoration: none; color: inherit; background: var(--plate); border: 3px solid var(--edge); border-radius: 10px; padding: 16px; margin-bottom: 12px; font-size: 1.3rem; }
a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
a span { display: block; color: var(--soft); font-size: 1rem; margin-top: 4px; }
</style>
</head>
